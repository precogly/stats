name: Collect stats

# Runs daily, gathers stats for every repo in tracked-repos.txt, and commits
# the results under data/. See README.md for setup.

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: collect-stats
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Collect stats
        env:
          # The built-in GITHUB_TOKEN can't read other repos' traffic data.
          GH_TOKEN: ${{ secrets.CLONE_TRAFFIC_TOKEN }}
        run: bash scripts/collect.sh

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Stats unchanged, nothing to commit."
            exit 0
          fi
          git commit --quiet --message "chore: update stats"
          git push
